server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://gts-backend-production.up.railway.app;
        proxy_set_header Host gts-backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
