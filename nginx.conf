server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # NB : l'app Angular appelle le back directement via environment.apiUrl ;
    # ce relais /api/ n'est utilisé que si une URL relative "/api/..." est appelée.
    location /api/ {
        proxy_pass https://gts-backend-production.up.railway.app/api/;
        proxy_set_header Host gts-backend-production.up.railway.app;

        # Vérification du certificat TLS du back (désactivée auparavant)
        proxy_ssl_server_name on;
        proxy_ssl_name gts-backend-production.up.railway.app;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
