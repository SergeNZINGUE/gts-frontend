name: Deploy GTS Frontend

on:
  push:
    branches:
      - main
      - homologation
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version
          
      - name: Deploy to Production
        if: github.ref_name == 'main'
        run: railway up --service gts-frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

      - name: Deploy to Homologation
        if: github.ref_name == 'homologation'
        run: railway up --service gts-frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_HOMOL }}

      - name: Deploy to Dev
        if: github.ref_name == 'dev'
        run: railway up --service gts-frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
